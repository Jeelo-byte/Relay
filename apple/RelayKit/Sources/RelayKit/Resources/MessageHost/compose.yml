name: relay-messages
services:
  synapse:
    image: ghcr.io/element-hq/synapse@sha256:390f5e67227378eb87c84627b57f0582cdb235fcc8159d89f371f37bf7cccfd7
    restart: unless-stopped
    ports:
    - 127.0.0.1:${RELAY_MATRIX_PORT:-8008}:8008
    volumes:
    - ./private/synapse:/data
  discord:
    image: dock.mau.dev/mautrix/discord@sha256:065405ca2f961b2687ca577c4eb65592c139d641342a9611d98b5394f30cf84a
    restart: unless-stopped
    depends_on:
    - synapse
    profiles:
    - bridges
    volumes:
    - ./private/discord:/data
  element:
    image: vectorim/element-web@sha256:f8700633d4336258af7a05b53865a4f479e0d628cf2d9ca83d28b5939314d4ce
    restart: unless-stopped
    ports:
    - 127.0.0.1:${RELAY_ELEMENT_PORT:-8088}:80
    volumes:
    - ./private/element/config.json:/app/config.json:ro
  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp@sha256:75ea4e648ed37ec19b06f1faa36139255bba22417d35fe2779b58960c6dd5a56
    restart: unless-stopped
    depends_on:
    - synapse
    profiles:
    - bridges
    volumes:
    - ./private/whatsapp:/data
  gmessages:
    image: dock.mau.dev/mautrix/gmessages@sha256:c9751d888d797dae3e351cd7a94a068b03a340a8896707d61c9d322be73866bd
    restart: unless-stopped
    depends_on:
    - synapse
    profiles:
    - bridges
    volumes:
    - ./private/gmessages:/data
  instagram:
    image: dock.mau.dev/mautrix/meta@sha256:7a094f465d2cbd434b88b50ead134174fc7e59429a85377f5d51cd162686bf1d
    restart: unless-stopped
    depends_on:
    - synapse
    profiles:
    - bridges
    volumes:
    - ./private/instagram:/data
