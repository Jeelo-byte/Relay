name: Relay
options:
  bundleIdPrefix: app.relay
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  RelayCore:
    path: apple/RelayKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Relay:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - path: apple/RelayApp
    dependencies:
      - package: RelayCore
        product: RelayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.relay.agreements
        PRODUCT_NAME: Relay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Relay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Relay does not use the camera.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your private Relay agreements.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SDKROOT: auto
        SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator macosx'
  RelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apple/RelayUITests]
    dependencies:
      - target: Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.relay.agreements.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Relay
schemes:
  Relay:
    build:
      targets:
        Relay: all
    test:
      targets: [RelayUITests]
    run:
      config: Debug
